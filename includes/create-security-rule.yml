---
- name: Palo Alto create security rule
  hosts: "panorama"
  connection: local
  gather_facts: false

  vars:
    perform_commit: true # set to false if you do not want the playbook to perform actual Panorama commits
    debug: false # set to true to show extra debug information
    lookup_tags: true # set to true to attempt policy rule tag lookup - EXPERIMENTAL
    explicit_rule_placement: true # set to true to attempt placing new rules in explicit order (requires lookup_tags to be true) - EXPERIMENTAL
    provider:
      ip_address: "{{ inventory_hostname }}"
      username: '{{ lookup("env", "ANSIBLE_NET_USERNAME") }}'
      password: '{{ lookup("env", "ANSIBLE_NET_PASSWORD") }}'

  tasks:
    - name: Find tag based on input variable
      when: lookup_tags
      block:

        - name: Find tag based on input variable - Get our application name from the EPG name
          ansible.builtin.set_fact:
            tag_object_name: "{{ source_object[0].split('_')[1] }}"

        - name: Find tag based on input variable - Get tag objects from Panorama
          paloaltonetworks.panos.panos_tag_object:
            provider: "{{ provider }}"
            state: 'gathered'
            gathered_filter: '*'
          register: gathered_tag_objects

        - name: Find tag based on input variable - Search for tag object
          ansible.builtin.set_fact:
            tag_object: >-
              {{ gathered_tag_objects.gathered
                | selectattr('name', 'search', tag_object_name)
                | rejectattr('name', 'match', '^0')
                | map(attribute='name')
                | list }}

        - name: Find tag based on input variable - Detect environment from epg name
          ansible.builtin.set_fact:
            env_tag: "{{ (epg_name.split('_') | intersect(['dev', 'tst', 'acc', 'prd', 'ota']) | first) | default('') }}"

    - name: Attempt explicit rule placement
      when: explicit_rule_placement
      block:

        - name: Attempt explicit rule placement [1/2] - Filter rules get all the rules with a group_tag matching tag object
          ansible.builtin.set_fact:
            tag_filtered_rules: >-
              {{
                security_rules.gathered
                | rejectattr('group_tag', 'equalto', none)
                | selectattr('group_tag', 'equalto', (tag_object | first))
                | list
              }}
          when:
            - tag_object is defined
            - (tag_object | length) > 0

        - name: Attempt explicit rule placement [2/2] - Get the rule name for the last rule in tag_filtered_rules list
          ansible.builtin.set_fact:
            last_rule_name: "{{ (tag_filtered_rules | last).rule_name }}"
          when: (tag_filtered_rules | default([]) | length) > 0

    - name: Create security rule (no explicit placement)
      paloaltonetworks.panos.panos_security_rule:
        provider: "{{ provider }}"
        device_group: "SDDC Proxy"
        rule_name: "{{ source_object[0].split(' - ')[0] }} to web"
        description: "{{ source_object[0].split(' - ')[0] }} to web"
        tag_name: >-
          {{
            ['sddc - automated']
            + ([env_tag] if (env_tag | default('') | string | trim | length) > 0 else [])
            + ([tag_object | first] if (tag_object | default([]) | length) > 0 else [])
          }}
        group_tag: "{{ (tag_object | default(['sddc - automated']) | first | default('sddc - automated')) | string | trim }}"
        source_zone: ['proxy-loopback']
        source_ip: "{{ source_object[0] }}"
        destination_zone: ['proxy-external']
        destination_ip: ['any']
        service: ['tcp-443']
        category: "{{ uc_name }}"
        group_profile: "sddc-strict-proxy-bp"
        log_setting: "forward-to-panorama"
        audit_comment: "AAP job ID: {{ awx_job_id | default('n/a') }} - AAP User: {{ awx_user_name | default('n/a') }} - ICD: {{ ticket_num | default('no-CR') }}"
        action: 'allow'
      when: (last_rule_name | default('') | string | trim | length) == 0

    - name: Create security rule (place after rule {{ last_rule_name }})
      paloaltonetworks.panos.panos_security_rule:
        provider: "{{ provider }}"
        device_group: "SDDC Proxy"
        rule_name: "{{ source_object[0].split(' - ')[0] }} to web"
        description: "{{ source_object[0].split(' - ')[0] }} to web"
        tag_name: >-
          {{
            ['sddc - automated']
            + ([env_tag] if (env_tag | default('') | string | trim | length) > 0 else [])
            + ([tag_object | first] if (tag_object | default([]) | length) > 0 else [])
          }}
        group_tag: "{{ (tag_object | default(['sddc - automated']) | first | default('sddc - automated')) | string | trim }}"
        source_zone: ['proxy-loopback']
        source_ip: "{{ source_object[0] }}"
        destination_zone: ['proxy-external']
        destination_ip: ['any']
        service: ['tcp-443']
        category: "{{ uc_name }}"
        action: 'allow'
        group_profile: "sddc-strict-proxy-bp"
        log_setting: "forward-to-panorama"
        audit_comment: "AAP job ID: {{ awx_job_id | default('n/a') }} - AAP User: {{ awx_user_name | default('n/a') }} - ICD: {{ ticket_num | default('no-CR') }}"
        location: 'after'
        existing_rule: "{{ last_rule_name }}"
      when: (last_rule_name | default('') | string | trim | length) > 0

    - name: Set commit needed to true
      ansible.builtin.set_fact:
        commit: true
      when: perform_commit

    - name: Set push needed to true
      ansible.builtin.set_fact:
        push: true
      when: perform_commit
